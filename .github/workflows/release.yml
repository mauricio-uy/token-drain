name: Publish signed release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.14.0
          cache: npm

      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (verified 2026-09-09)
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Cache cargo-audit
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cargo/bin/cargo-audit.exe
          key: ${{ runner.os }}-cargo-audit-0.22.2

      - name: Install cargo-audit
        shell: pwsh
        run: |
          if (-not (Get-Command cargo-audit -ErrorAction SilentlyContinue)) {
            cargo install cargo-audit --version 0.22.2 --locked --no-default-features
          }

      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock

      - name: Verify release manifests
        run: npm run check:version

      - name: Verify tag matches application version
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          if ($env:RELEASE_REF_TYPE -ne "tag") {
            throw "Release workflow must run from a tag, not a $env:RELEASE_REF_TYPE ref."
          }
          if ($env:RELEASE_TAG -ne "v$version") {
            throw "Tag $env:RELEASE_TAG does not match application version $version."
          }
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "This workflow publishes stable versions only."
          }

      - name: Choose release destination
        id: destination
        shell: pwsh
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if ($env:REF_TYPE -eq "tag") {
            "tag=$env:REF_NAME" >> $env:GITHUB_OUTPUT
          } else {
            $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
            "tag=v$version" >> $env:GITHUB_OUTPUT
          }

      - name: Prepare versioned release notes
        id: notes
        shell: pwsh
        run: node scripts/release-notes.mjs "$env:RUNNER_TEMP/release-notes.md"

      - name: Update existing draft metadata
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.destination.outputs.tag }}
          RELEASE_COMMIT: ${{ github.sha }}
        run: |
          $draft = gh release view $env:RELEASE_TAG --json isDraft --jq .isDraft 2>$null
          if ($LASTEXITCODE -eq 0) {
            if ($draft -ne "true") { throw "Published releases must not be overwritten." }
            gh release edit $env:RELEASE_TAG --draft --target $env:RELEASE_COMMIT --title "Token Drain $env:RELEASE_TAG" --notes-file "$env:RUNNER_TEMP/release-notes.md"
            if ($LASTEXITCODE -ne 0) { throw "Could not update draft metadata." }
          } else {
            # Tauri creates a new draft when this version does not exist yet.
            $global:LASTEXITCODE = 0
          }

      - name: Verify signing secret is configured
        shell: pwsh
        env:
          SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:SIGNING_KEY)) {
            throw "Configure the TAURI_SIGNING_PRIVATE_KEY repository secret before releasing."
          }

      - name: Run frontend tests
        run: npm run test:frontend

      - name: Build production frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run locked Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Run Clippy with warnings denied
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings

      - name: Build and sign draft release assets
        uses: tauri-apps/tauri-action@1ddc7b49b13c3038297360482fcb3e058764d7c9 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ steps.destination.outputs.tag }}
          releaseCommitish: ${{ github.sha }}
          releaseName: Token Drain v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          generateReleaseNotes: false
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          args: --bundles nsis -- --locked

      - name: Validate uploaded assets before publication
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.destination.outputs.tag }}
        run: |
          $assetDirectory = Join-Path $env:RUNNER_TEMP "release-assets"
          gh release download $env:RELEASE_TAG --dir $assetDirectory
          if ($LASTEXITCODE -ne 0) { throw "Could not download draft assets." }
          node scripts/verify-release.mjs $assetDirectory $env:RELEASE_TAG
          if ($LASTEXITCODE -ne 0) { throw "Release asset validation failed." }

      - name: Publish complete release
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release edit $env:RELEASE_TAG --draft=false --latest
