name: Continuous integration

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  verify:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          cache: npm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable (verified 2026-09-09)
        with:
          toolchain: 1.98.1
          components: rustfmt, clippy

      - name: Cache Rust dependencies and target
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-rust-1.98.1-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit frontend dependencies
        run: npm audit --audit-level=high

      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked --manifest-path src-tauri/Cargo.toml

      - name: Cache cargo-audit
        uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684 # v4.2.3
        with:
          path: ~/.cargo/bin/cargo-audit.exe
          key: ${{ runner.os }}-cargo-audit-0.22.2

      - name: Install cargo-audit
        shell: pwsh
        run: |
          if (-not (Get-Command cargo-audit -ErrorAction SilentlyContinue)) {
            cargo install cargo-audit --version 0.22.2 --locked --no-default-features
          }

      - name: Audit Rust dependencies
        run: cargo audit --file src-tauri/Cargo.lock

      - name: Verify release manifests
        run: npm run check:version

      - name: Run frontend tests
        run: npm run test:frontend

      - name: Build production frontend
        run: npm run build

      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check

      - name: Run Rust tests
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

      - name: Run Clippy with warnings denied
        run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --all-features --locked -- -D warnings

      - name: Verify native Tauri build without bundling
        run: node node_modules/@tauri-apps/cli/tauri.js build --no-bundle --config '{"bundle":{"active":false,"createUpdaterArtifacts":false}}'
