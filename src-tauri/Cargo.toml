[package]
name = "token-drain"
version = "0.1.0"
description = "Live usage and rate-limit status for AI subscriptions"
authors = ["mauricio-uy"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "token_drain_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# `tray-icon` is what puts the app in the notification area. The rail has no
# taskbar entry by design, so without this there is no way to reach the app
# at all.
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "time", "sync"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }
thiserror = "2.0.20"
dirs = "6.0.0"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "http2"] }
tauri-plugin-autostart = "2.5.1"
tauri-plugin-single-instance = "2.4.4"
tauri-plugin-notification = "2.4.0"
tauri-plugin-updater = "2.11.0"
tauri-plugin-opener = "2.5.5"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util", "macros", "rt-multi-thread", "time"] }
